<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K IRAQ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050505;
color:white;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(0,0,0,.85);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:32px;
font-weight:900;
letter-spacing:3px;
}

nav a{
color:white;
text-decoration:none;
margin-left:30px;
transition:.3s;
}

nav a:hover{
color:#888;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:70px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
color:#ccc;
margin-bottom:30px;
}

.btn{
background:white;
color:black;
padding:15px 40px;
text-decoration:none;
font-weight:bold;
border-radius:50px;
transition:.3s;
}

.btn:hover{
background:#ddd;
}

.title{
text-align:center;
padding:70px 20px 20px;
font-size:40px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
padding:40px 8%;
}

.card{
background:#111;
border-radius:18px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.card h2{
padding:15px;
font-size:22px;
}

.price{
padding:0 15px;
font-size:22px;
font-weight:bold;
}

.buy{
margin:15px;
display:block;
background:white;
color:black;
text-align:center;
padding:12px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

footer{
margin-top:80px;
padding:40px;
text-align:center;
background:#111;
color:#888;
}

@media(max-width:768px){

.hero h1{
font-size:45px;
}

nav{
display:none;
}

}
</style>

</head>
<body>

<header>

<div class="logo">
Y2K IRAQ
</div>

<nav>

<a href="#">Home</a>

<a href="#">Shop</a>

<a href="#">New</a>

<a href="#">Contact</a>

</nav>

</header>

<section class="hero">

<h1>PREMIUM STREETWEAR</h1>

<p>Modern Fashion • Iraq</p>

<a href="#shop" class="btn">
SHOP NOW
</a>

</section>

<h1 class="title" id="shop">
Featured Products
</h1>

<section class="products">

<div class="card">

<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80">

<h2>Oversized Tee</h2>

<p class="price">
35,000 IQD
</p>

<a class="buy" href="#">
Buy Now
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80">

<h2>Zip Hoodie</h2>

<p class="price">
65,000 IQD
</p>

<a class="buy" href="#">
Buy Now
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=800&q=80">

<h2>Cargo Pants</h2>

<p class="price">
55,000 IQD
</p>

<a class="buy" href="#">
Buy Now
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=800&q=80">

<h2>Baggy Jeans</h2>

<p class="price">
70,000 IQD
</p>

<a class="buy" href="#">
Buy Now
</a>

</div>

</section>

<footer>

© 2026 Y2K IRAQ

<br><br>

Instagram: @y2k.iraq

</footer>

</body>
</html>
